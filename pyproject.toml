[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-monitor"
version = "0.1.0"
description = "Multi-provider cloud inventory and cost estimates (Hetzner, DigitalOcean, Cloudflare, DreamHost, GoDaddy, AWS, GCP)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["monitor*"]
